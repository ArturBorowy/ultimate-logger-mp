name: Build+Test

on: [pull_request]

jobs:
  buildAndTest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: assemble
        run: bash ./gradlew assemble

      - name: test
        run: bash ./gradlew test